<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pit Wall Studio — Formula 1 Analytics</title>
<meta name="description" content="Build interactive Formula 1 reports from real session data with configurable visuals, cross-filtering, saved projects, and analysis templates.">
<meta property="og:title" content="Pit Wall Studio — Formula 1 Analytics">
<meta property="og:description" content="A project-based Formula 1 analytics studio built on real session data.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://josephbsmith.com/pit-wall-studio">
<meta property="og:image" content="https://josephbsmith.com/og-card-yellowstone.png">
<link rel="canonical" href="https://josephbsmith.com/pit-wall-studio">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#080a0d">
<style>
:root{--bg:#080a0d;--rail:#0d1015;--panel:#12161d;--panel2:#171c24;--line:#29313d;--line2:#394452;--ink:#f4f6f8;--muted:#8994a3;--dim:#596474;--red:#ff3146;--cyan:#09dfeb;--purple:#a886ff;--green:#68f5a6;--yellow:#ffd45c;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}button,input,select{font:inherit}button,a,input,select{outline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan)}button{color:inherit}.app{min-height:100vh}.topbar{height:58px;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;border-bottom:1px solid var(--line);background:#090b0ef5;position:sticky;top:0;z-index:30}.brand{height:58px;display:flex;align-items:center;padding:0 20px;border-right:1px solid var(--line);color:var(--ink);font:950 italic 16px var(--sans);letter-spacing:-.03em;text-decoration:none;text-transform:uppercase}.brand i{color:var(--red);font-style:normal}.mode-nav{display:flex;height:58px;border-right:1px solid var(--line)}.mode-nav a{min-width:86px;display:grid;place-items:center;padding:0 12px;border-right:1px solid #1d232c;color:var(--muted);font:800 8px var(--mono);letter-spacing:.11em;text-decoration:none;text-transform:uppercase}.mode-nav a:hover{color:var(--ink);background:var(--panel)}.mode-nav a.active{background:var(--ink);color:var(--bg)}.project-title{min-width:0;padding:0 18px}.project-title input{width:min(430px,100%);height:34px;border:1px solid transparent;background:transparent;color:var(--ink);font:800 12px var(--sans)}.project-title input:hover,.project-title input:focus{border-color:var(--line);background:var(--rail);padding-left:9px}.save-state{display:flex;align-items:center;gap:8px;padding:0 18px;color:var(--muted);font:700 8px var(--mono);letter-spacing:.1em;text-transform:uppercase}.save-state .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 14px #68f5a677}.save-state.loading .dot{background:var(--yellow)}.save-state.error .dot{background:var(--red)}
.studio-shell{display:grid;grid-template-columns:238px minmax(600px,1fr) 270px;min-height:calc(100vh - 58px)}.left-rail,.inspector{background:var(--rail);min-width:0}.left-rail{border-right:1px solid var(--line);padding-bottom:30px}.inspector{border-left:1px solid var(--line)}.rail-section{border-bottom:1px solid var(--line);padding:15px 13px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;color:var(--muted);font:850 8px var(--mono);letter-spacing:.14em;text-transform:uppercase}.section-head button,.icon-button{width:27px;height:27px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}.section-head button:hover,.icon-button:hover{border-color:var(--line2);background:var(--panel2);color:var(--ink)}.project-list,.page-list,.template-list{display:grid;gap:5px}.rail-item{width:100%;min-height:35px;display:grid;grid-template-columns:4px minmax(0,1fr) auto;align-items:center;gap:9px;padding:0 9px 0 0;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;cursor:pointer}.rail-item:before{content:"";align-self:stretch;background:transparent}.rail-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:750 10px var(--sans)}.rail-item small{color:var(--dim);font:700 7px var(--mono)}.rail-item:hover{background:var(--panel);color:var(--ink)}.rail-item.active{border-color:var(--line);background:var(--panel2);color:var(--ink)}.rail-item.active:before{background:var(--red)}.template-button{width:100%;min-height:39px;display:grid;grid-template-columns:28px 1fr;align-items:center;gap:8px;padding:5px 8px;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;cursor:pointer}.template-button:hover{border-color:var(--line);background:var(--panel);color:var(--ink)}.template-button b{display:grid;place-items:center;width:26px;height:26px;border:1px solid var(--line);color:var(--cyan);font:800 8px var(--mono)}.template-button span{font:750 9px/1.3 var(--sans)}.session-form{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:6px}.session-form input,.control-input{min-width:0;height:34px;border:1px solid var(--line);background:#090b0f;color:var(--ink);padding:0 9px;font:750 10px var(--mono)}.session-form button,.primary-button{height:34px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:900 8px var(--mono);letter-spacing:.09em;text-transform:uppercase;cursor:pointer}.session-form button:hover,.primary-button:hover{border-color:var(--cyan);background:var(--cyan)}.dataset-meta{margin-top:9px;color:var(--muted);font:650 8px/1.5 var(--mono)}.dataset-meta strong{display:block;color:var(--ink);font-size:9px}.rail-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.secondary-button{min-height:32px;border:1px solid var(--line);background:transparent;color:var(--muted);font:800 8px var(--mono);letter-spacing:.07em;text-transform:uppercase;cursor:pointer}.secondary-button:hover{border-color:var(--line2);background:var(--panel2);color:var(--ink)}
.workspace{min-width:0;background:#0a0c10}.commandbar{min-height:50px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:#0e1116}.breadcrumbs{min-width:0;color:var(--muted);font:750 8px var(--mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.breadcrumbs b{color:var(--ink)}.command-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}.command-button{height:32px;padding:0 11px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:800 8px var(--mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.command-button:hover{border-color:var(--line2);color:var(--ink)}.command-button.accent{border-color:var(--cyan);color:var(--cyan)}.filterbar{min-height:54px;display:flex;align-items:end;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);background:#0b0e12;overflow-x:auto}.filter-control{display:grid;gap:5px;min-width:112px}.filter-control label{color:var(--dim);font:800 7px var(--mono);letter-spacing:.11em;text-transform:uppercase}.filter-control select,.filter-control input{height:29px;min-width:0;border:1px solid var(--line);background:var(--rail);color:var(--ink);padding:0 8px;font:750 9px var(--mono)}.filter-control.range{grid-template-columns:1fr 1fr}.filter-control.range label{grid-column:1/-1}.filter-check{height:29px;display:flex;align-items:center;gap:7px;padding:0 9px;border:1px solid var(--line);color:var(--muted);font:750 8px var(--mono);white-space:nowrap}.filter-check input{accent-color:var(--cyan)}.clear-filter{height:29px;border:0;background:transparent;color:var(--red);font:800 8px var(--mono);cursor:pointer}.canvas-wrap{padding:18px;overflow:auto}.canvas-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:14px}.canvas-head p{margin:0 0 6px;color:var(--red);font:850 8px var(--mono);letter-spacing:.14em;text-transform:uppercase}.canvas-head h1{margin:0;font:950 italic 29px/.95 var(--sans);letter-spacing:-.04em;text-transform:uppercase}.canvas-head .coverage{text-align:right;color:var(--muted);font:700 8px/1.5 var(--mono)}.report-canvas{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-flow:row dense;gap:10px;align-items:stretch}.widget{grid-column:span var(--span,6);min-height:var(--height,260px);display:flex;flex-direction:column;border:1px solid var(--line);background:var(--panel);position:relative;overflow:hidden;transition:border-color .15s,transform .15s}.widget:hover{border-color:var(--line2)}.widget.selected{border-color:var(--cyan);box-shadow:0 0 0 1px #09dfeb33}.widget-head{min-height:43px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;border-bottom:1px solid var(--line);cursor:pointer}.widget-title{min-width:0}.widget-title strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:850 9px var(--mono);letter-spacing:.08em;text-transform:uppercase}.widget-title small{display:block;margin-top:3px;color:var(--dim);font:650 7px var(--mono)}.widget-kind{color:var(--muted);font:800 7px var(--mono);letter-spacing:.1em;text-transform:uppercase}.widget-body{flex:1;min-height:0;padding:13px}.widget-empty{height:100%;min-height:130px;display:grid;place-items:center;color:var(--dim);font:700 9px var(--mono);text-align:center}.kpi-body{height:100%;display:flex;flex-direction:column;justify-content:center}.kpi-body strong{font:950 39px/.9 var(--mono);letter-spacing:-.08em}.kpi-body p{margin:12px 0 0;color:var(--muted);font:650 9px/1.5 var(--mono)}.kpi-accent{width:34px;height:4px;margin-bottom:18px;background:var(--cyan)}.chart-svg{display:block;width:100%;height:100%;min-height:150px}.chart-grid{stroke:#252c35;stroke-width:1}.chart-axis{fill:var(--muted);font:650 8px var(--mono)}.chart-mark{cursor:pointer;transition:opacity .15s}.chart-mark:hover{opacity:.72}.chart-line{fill:none;stroke:var(--cyan);stroke-width:2.5;vector-effect:non-scaling-stroke}.chart-dot{fill:var(--cyan);stroke:#081014;stroke-width:1;cursor:pointer}.data-table{width:100%;border-collapse:collapse;font:700 8px var(--mono)}.data-table th{padding:0 8px 9px;color:var(--dim);text-align:left;letter-spacing:.08em;text-transform:uppercase}.data-table td{padding:8px;border-top:1px solid var(--line);color:var(--muted)}.data-table td:last-child,.data-table th:last-child{text-align:right;color:var(--ink)}.data-table tbody tr{cursor:pointer}.data-table tbody tr:hover{background:var(--panel2)}.rank{display:inline-grid;place-items:center;width:19px;height:19px;margin-right:7px;border:1px solid var(--line);color:var(--dim)}.no-page{grid-column:1/-1;min-height:450px;display:grid;place-items:center;border:1px dashed var(--line);color:var(--muted);text-align:center}.no-page strong{display:block;margin-bottom:9px;color:var(--ink);font:950 italic 24px var(--sans);text-transform:uppercase}.no-page button{margin-top:16px}
.inspector-head{height:45px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);font:850 8px var(--mono);letter-spacing:.13em;text-transform:uppercase}.inspector-section{padding:14px;border-bottom:1px solid var(--line)}.inspector-label{display:block;margin:0 0 7px;color:var(--dim);font:800 7px var(--mono);letter-spacing:.11em;text-transform:uppercase}.inspector-field{width:100%;height:34px;margin-bottom:10px;border:1px solid var(--line);background:#090b0f;color:var(--ink);padding:0 9px;font:750 9px var(--mono)}.inspector-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.visual-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.visual-picker button{height:34px;border:1px solid var(--line);background:transparent;color:var(--muted);font:900 8px var(--mono);cursor:pointer}.visual-picker button:hover,.visual-picker button.active{border-color:var(--cyan);background:#0c282d;color:var(--cyan)}.fields{display:grid;gap:4px}.field-button{width:100%;min-height:32px;display:flex;align-items:center;justify-content:space-between;gap:7px;padding:0 8px;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;cursor:pointer}.field-button:hover{border-color:var(--line);background:var(--panel);color:var(--ink)}.field-button span{font:750 9px var(--sans)}.field-button small{color:var(--dim);font:700 7px var(--mono);text-transform:uppercase}.measure-dot{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--purple)}.dimension-dot{display:inline-block;width:7px;height:7px;margin-right:7px;background:var(--cyan)}.empty-inspector{padding:34px 15px;color:var(--muted);font:650 9px/1.6 var(--mono);text-align:center}.danger-button{width:100%;height:32px;border:1px solid #59232c;background:transparent;color:#ff7887;font:800 8px var(--mono);letter-spacing:.09em;text-transform:uppercase;cursor:pointer}.danger-button:hover{background:#32141a}.toast{position:fixed;right:18px;bottom:18px;z-index:80;max-width:360px;padding:12px 15px;border:1px solid var(--line2);background:#151a21;color:var(--ink);font:750 9px/1.4 var(--mono);box-shadow:0 18px 55px #0008;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:1180px){.studio-shell{grid-template-columns:205px minmax(550px,1fr)}.inspector{position:fixed;right:0;top:58px;bottom:0;width:285px;z-index:40;box-shadow:-20px 0 50px #0009;transform:translateX(100%);transition:transform .2s}.inspector.open{transform:none}.inspector-close{display:block!important}}@media(min-width:1181px){.inspector-close{display:none!important}}@media(max-width:820px){.topbar{grid-template-columns:auto minmax(0,1fr) auto}.mode-nav{display:none}.project-title{padding:0 10px}.save-state{padding:0 10px}.save-state span:last-child{display:none}.studio-shell{display:block}.left-rail{position:fixed;left:0;top:58px;bottom:0;width:245px;z-index:45;box-shadow:20px 0 50px #0009;transform:translateX(-100%);transition:transform .2s;overflow:auto}.left-rail.open{transform:none}.workspace{min-height:calc(100vh - 58px)}.mobile-menu{display:inline-block!important}.filterbar{padding-left:10px}.canvas-wrap{padding:10px}.report-canvas{grid-template-columns:1fr}.widget{grid-column:1!important;min-height:min(var(--height,260px),360px)}.canvas-head h1{font-size:23px}}@media print{.topbar,.left-rail,.inspector,.commandbar,.filterbar{display:none!important}.studio-shell{display:block}.canvas-wrap{padding:0}.widget{break-inside:avoid}.workspace{background:#fff}.report-canvas{gap:8px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="/pit-wall">PIT <i>WALL</i></a>
    <nav class="mode-nav" aria-label="Pit Wall products">
      <a href="/pit-wall">Live wall</a><a href="/pit-wall?workspace=analytics">Analytics</a><a class="active" href="/pit-wall-studio" aria-current="page">Studio</a>
    </nav>
    <div class="project-title"><label class="sr-only" for="projectTitle">Project title</label><input id="projectTitle" value="Race Intelligence" autocomplete="off"></div>
    <div class="save-state" id="saveState"><span class="dot"></span><span id="saveLabel">Saved locally</span></div>
  </header>

  <div class="studio-shell">
    <aside class="left-rail" id="leftRail" aria-label="Projects and pages">
      <section class="rail-section">
        <div class="section-head"><span>Projects</span><button id="newProject" title="New project" aria-label="New project">+</button></div>
        <div class="project-list" id="projectList"></div>
      </section>
      <section class="rail-section">
        <div class="section-head"><span>Dataset</span><span id="datasetStatus">Demo</span></div>
        <form class="session-form" id="sessionForm">
          <label class="sr-only" for="sessionKey">OpenF1 session key</label><input id="sessionKey" inputmode="numeric" placeholder="Session key" value="9979"><button type="submit">Load</button>
        </form>
        <div class="dataset-meta" id="datasetMeta">Monaco 2025 race demo<br>Enter any OpenF1 session key.</div>
      </section>
      <section class="rail-section">
        <div class="section-head"><span>Pages</span><button id="newBlankPage" title="New blank page" aria-label="New blank page">+</button></div>
        <div class="page-list" id="pageList"></div>
      </section>
      <section class="rail-section">
        <div class="section-head"><span>Analysis templates</span></div>
        <div class="template-list" id="templateList"></div>
      </section>
      <section class="rail-section">
        <div class="section-head"><span>Project file</span></div>
        <div class="rail-actions"><button class="secondary-button" id="exportProject">Export</button><button class="secondary-button" id="importProject">Import</button></div>
        <input class="sr-only" type="file" id="importFile" accept="application/json,.json">
      </section>
    </aside>

    <main class="workspace">
      <div class="commandbar">
        <div class="breadcrumbs"><button class="icon-button mobile-menu" id="openRail" style="display:none" aria-label="Open project navigation">☰</button> <span id="breadcrumbProject">Race Intelligence</span> / <b id="breadcrumbPage">Race overview</b></div>
        <div class="command-actions">
          <button class="command-button" id="undoFilter">Clear filters</button>
          <button class="command-button" id="exportCsv">Data CSV</button>
          <button class="command-button" id="printReport">Print / PDF</button>
          <button class="command-button" id="shareView">Share view</button>
          <button class="command-button accent" id="addVisual">+ Visual</button>
          <button class="command-button" id="openInspector">Fields &amp; design</button>
        </div>
      </div>
      <div class="filterbar" aria-label="Report filters">
        <div class="filter-control"><label for="driverFilter">Driver</label><select id="driverFilter"></select></div>
        <div class="filter-control"><label for="teamFilter">Team</label><select id="teamFilter"></select></div>
        <div class="filter-control"><label for="compoundFilter">Compound</label><select id="compoundFilter"></select></div>
        <div class="filter-control range"><label>Lap range</label><input id="lapMin" type="number" min="1" aria-label="Minimum lap"><input id="lapMax" type="number" min="1" aria-label="Maximum lap"></div>
        <label class="filter-check"><input id="representativeFilter" type="checkbox" checked> Representative laps</label>
        <button class="clear-filter" id="clearFilters">RESET</button>
      </div>
      <div class="canvas-wrap">
        <div class="canvas-head">
          <div><p id="reportKicker">Interactive report</p><h1 id="pageTitle">Race overview</h1></div>
          <div class="coverage" id="coverage">Loading session data…</div>
        </div>
        <section class="report-canvas" id="reportCanvas" aria-live="polite"></section>
      </div>
    </main>

    <aside class="inspector" id="inspector" aria-label="Visual configuration">
      <div class="inspector-head">Fields &amp; design <button class="icon-button inspector-close" id="closeInspector" style="margin-left:auto" aria-label="Close inspector">×</button></div>
      <div id="visualInspector"></div>
      <section class="inspector-section">
        <label class="inspector-label" for="fieldSearch">Dataset fields</label>
        <input class="inspector-field" id="fieldSearch" placeholder="Search fields" autocomplete="off">
        <div class="fields" id="fieldList"></div>
      </section>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const STORAGE_KEY='pit-wall-studio-v1';
const DEFAULT_SESSION='9979';
const PALETTE=['#09dfeb','#ff3146','#a886ff','#68f5a6','#ffd45c','#ff8b4d','#56a8ff','#f57ed7'];
const DIMENSIONS={driver:{label:'Driver',type:'text'},team:{label:'Team',type:'text'},compound:{label:'Compound',type:'text'},lap:{label:'Lap',type:'number'},stint:{label:'Stint',type:'number'}};
const METRICS={
  best_lap:{label:'Best lap',unit:'time',description:'Fastest valid lap'},
  median_pace:{label:'Median pace',unit:'time',description:'Median lap time'},
  avg_lap:{label:'Average lap',unit:'time',description:'Mean lap time'},
  lap_count:{label:'Lap count',unit:'integer',description:'Recorded laps'},
  driver_count:{label:'Driver count',unit:'integer',description:'Unique drivers'},
  compound_count:{label:'Compound count',unit:'integer',description:'Unique tyre compounds'},
  theoretical_best:{label:'Theoretical best',unit:'time',description:'Best sector sum'},
  top_speed:{label:'Top speed',unit:'speed',description:'Maximum recorded speed'},
  degradation:{label:'Tyre degradation',unit:'rate',description:'Seconds lost per lap'},
  consistency:{label:'Consistency spread',unit:'rate',description:'Lap-time standard deviation'},
  sector_1:{label:'Best sector 1',unit:'seconds',description:'Fastest first sector'},
  sector_2:{label:'Best sector 2',unit:'seconds',description:'Fastest second sector'},
  sector_3:{label:'Best sector 3',unit:'seconds',description:'Fastest third sector'},
  tyre_age:{label:'Maximum tyre age',unit:'laps',description:'Oldest tyre lap'}
};
const VISUALS={kpi:'KPI',bar:'Bar',line:'Line',scatter:'Scatter',table:'Table'};
const TEMPLATES=[
  {id:'overview',name:'Race overview',icon:'01',widgets:[
    ['kpi','Fastest lap',null,'best_lap',3,'small'],['kpi','Theoretical best',null,'theoretical_best',3,'small'],['kpi','Top speed',null,'top_speed',3,'small'],['kpi','Analysis laps',null,'lap_count',3,'small'],
    ['line','Race pace','lap','median_pace',8,'large'],['bar','Driver pace','driver','best_lap',4,'large'],['table','Field ranking','driver','best_lap',12,'medium']]},
  {id:'pace',name:'Pace & degradation',icon:'02',widgets:[
    ['line','Lap-time evolution','lap','median_pace',8,'large'],['bar','Median race pace','driver','median_pace',4,'large'],['scatter','Pace versus degradation','driver','median_pace',6,'large','degradation'],['bar','Tyre degradation by compound','compound','degradation',6,'large'],['table','Stint intelligence','driver','consistency',12,'medium']]},
  {id:'strategy',name:'Strategy & tyres',icon:'03',widgets:[
    ['kpi','Representative laps',null,'lap_count',4,'small'],['kpi','Oldest tyre run',null,'tyre_age',4,'small'],['kpi','Compounds used',null,'compound_count',4,'small'],['line','Stint pace curve','lap','median_pace',8,'large'],['bar','Compound pace','compound','median_pace',4,'large'],['table','Driver strategy view','driver','tyre_age',12,'medium']]},
  {id:'performance',name:'Car performance',icon:'04',widgets:[
    ['kpi','Session top speed',null,'top_speed',4,'small'],['kpi','Fastest S1',null,'sector_1',4,'small'],['kpi','Fastest S3',null,'sector_3',4,'small'],['bar','Speed trap ranking','driver','top_speed',6,'large'],['scatter','Speed versus lap time','driver','top_speed',6,'large','best_lap'],['table','Sector performance','driver','sector_2',12,'medium']]},
  {id:'blank',name:'Blank canvas',icon:'05',widgets:[]}
];
const HEIGHTS={small:150,medium:245,large:330};
const qs=(id)=>document.getElementById(id);
const esc=(value)=>String(value??'').replace(/[&<>"']/g,(character)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
const uid=(prefix='id')=>`${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
const finite=(value)=>Number.isFinite(Number(value))?Number(value):null;
const median=(values)=>{const clean=values.map(finite).filter((value)=>value!==null).sort((a,b)=>a-b);if(!clean.length)return null;const middle=Math.floor(clean.length/2);return clean.length%2?clean[middle]:(clean[middle-1]+clean[middle])/2};
const average=(values)=>{const clean=values.map(finite).filter((value)=>value!==null);return clean.length?clean.reduce((sum,value)=>sum+value,0)/clean.length:null};
const deviation=(values)=>{const clean=values.map(finite).filter((value)=>value!==null),mean=average(clean);return mean===null?null:Math.sqrt(clean.reduce((sum,value)=>sum+(value-mean)**2,0)/clean.length)};
const minValue=(values)=>{const clean=values.map(finite).filter((value)=>value!==null);return clean.length?Math.min(...clean):null};
const maxValue=(values)=>{const clean=values.map(finite).filter((value)=>value!==null);return clean.length?Math.max(...clean):null};
function time(value){if(value===null||value===undefined||!Number.isFinite(Number(value)))return '—';const total=Number(value),minutes=Math.floor(total/60),seconds=(total-minutes*60).toFixed(3).padStart(6,'0');return minutes?`${minutes}:${seconds}`:`${Number(seconds).toFixed(3)}s`}
function metricFormat(value,id){if(value===null||value===undefined||!Number.isFinite(Number(value)))return '—';const unit=METRICS[id]?.unit;return unit==='time'?time(value):unit==='speed'?`${Number(value).toFixed(1)} km/h`:unit==='rate'?`${Number(value).toFixed(3)} s/lap`:unit==='seconds'?`${Number(value).toFixed(3)}s`:unit==='laps'?`${Math.round(value)} laps`:unit==='integer'?Math.round(value).toLocaleString():Number(value).toFixed(2)}
function safeColour(value){const colour=String(value||'').replace(/[^0-9a-f]/gi,'');return colour.length===6?`#${colour}`:PALETTE[0]}
function download(name,content,type){const link=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function clone(value){return JSON.parse(JSON.stringify(value))}

function widgetFrom(definition){const [type,title,dimension,measure,span=6,height='medium',measure2=null]=definition;return{id:uid('visual'),type,title,dimension,measure,measure2,span,height}}
function pageFromTemplate(template){return{id:uid('page'),name:template.name,template:template.id,widgets:template.widgets.map(widgetFrom)};}
function newProject(name='Race Intelligence',session=DEFAULT_SESSION){const page=pageFromTemplate(TEMPLATES[0]);return{id:uid('project'),name,session,activePageId:page.id,pages:[page],filters:{driver:'ALL',team:'ALL',compound:'ALL',representative:true,lapMin:null,lapMax:null},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}}
function defaultStore(){const project=newProject();return{version:1,activeProjectId:project.id,projects:[project]}}
function readStore(){try{const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY));if(parsed?.version===1&&Array.isArray(parsed.projects)&&parsed.projects.length)return parsed}catch(error){}return defaultStore()}
let store=readStore(),sessionState=null,rows=[],selectedWidgetId=null,saveTimer=null,toastTimer=null,loadSequence=0;
function activeProject(){return store.projects.find((project)=>project.id===store.activeProjectId)||store.projects[0]}
function activePage(){const project=activeProject();return project?.pages.find((page)=>page.id===project.activePageId)||project?.pages[0]}
function selectedWidget(){return activePage()?.widgets.find((widget)=>widget.id===selectedWidgetId)||null}
function persist(message='Saved locally'){const project=activeProject();if(project)project.updatedAt=new Date().toISOString();clearTimeout(saveTimer);qs('saveState').className='save-state loading';qs('saveLabel').textContent='Saving';saveTimer=setTimeout(()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(store));qs('saveState').className='save-state';qs('saveLabel').textContent=message}catch(error){qs('saveState').className='save-state error';qs('saveLabel').textContent='Storage full'}},160)}
function toast(message){clearTimeout(toastTimer);qs('toast').textContent=message;qs('toast').classList.add('show');toastTimer=setTimeout(()=>qs('toast').classList.remove('show'),2600)}
function options(values,current,allLabel='All'){return`<option value="ALL">${allLabel}</option>${values.map((value)=>`<option value="${esc(value)}"${String(value)===String(current)?' selected':''}>${esc(value)}</option>`).join('')}`}
function syncUrl(){const project=activeProject(),page=activePage(),url=new URL(location.href);url.searchParams.set('session',project.session);if(page)url.searchParams.set('page',page.id);url.searchParams.delete('report');history.replaceState({},'',url)}

function buildRows(analytics){return(analytics?.drivers||[]).flatMap((driver)=>driver.laps.map((lap)=>{const stint=driver.stints?.find((item)=>Number(item.number)===Number(lap.stint));return{driver:driver.name,driverNumber:driver.driver_number,fullName:driver.full_name,team:driver.team||'Unknown',colour:driver.colour,lap:finite(lap.lap),lap_time:finite(lap.time),s1:finite(lap.s1),s2:finite(lap.s2),s3:finite(lap.s3),i1:finite(lap.i1),i2:finite(lap.i2),trap:finite(lap.trap),compound:lap.compound||'Unknown',stint:finite(lap.stint),tyre_age:finite(lap.tyre_age),pit_out:Boolean(lap.pit_out),representative:Boolean(lap.representative),date:lap.date,theoretical:finite(driver.theoretical_best),driverConsistency:finite(driver.consistency),stintDegradation:finite(stint?.degradation)}}))}
function filteredRows(){const filters=activeProject().filters;return rows.filter((row)=>(filters.driver==='ALL'||row.driver===filters.driver)&&(filters.team==='ALL'||row.team===filters.team)&&(filters.compound==='ALL'||row.compound===filters.compound)&&(!filters.representative||row.representative)&&(filters.lapMin===null||row.lap>=filters.lapMin)&&(filters.lapMax===null||row.lap<=filters.lapMax))}
function metricValue(data,id){const timed=data.filter((row)=>row.lap_time!==null);switch(id){case'best_lap':return minValue(timed.map((row)=>row.lap_time));case'median_pace':return median(timed.map((row)=>row.lap_time));case'avg_lap':return average(timed.map((row)=>row.lap_time));case'lap_count':return data.length;case'driver_count':return new Set(data.map((row)=>row.driver)).size;case'compound_count':return new Set(data.map((row)=>row.compound).filter((value)=>value&&value!=='Unknown')).size;case'theoretical_best':return minValue(data.map((row)=>row.theoretical));case'top_speed':return maxValue(data.flatMap((row)=>[row.trap,row.i1,row.i2]));case'degradation':return median(data.map((row)=>row.stintDegradation));case'consistency':return deviation(timed.map((row)=>row.lap_time));case'sector_1':return minValue(data.map((row)=>row.s1));case'sector_2':return minValue(data.map((row)=>row.s2));case'sector_3':return minValue(data.map((row)=>row.s3));case'tyre_age':return maxValue(data.map((row)=>row.tyre_age));default:return null}}
function groupsFor(data,dimension,measure){if(!dimension)return[{key:'All',rows:data,value:metricValue(data,measure)}];const groups=new Map();for(const row of data){const key=row[dimension]??'Unknown';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(row)}return[...groups].map(([key,groupRows])=>({key,rows:groupRows,value:metricValue(groupRows,measure),colour:dimension==='driver'?safeColour(groupRows[0]?.colour):null})).filter((group)=>group.value!==null).sort((a,b)=>DIMENSIONS[dimension]?.type==='number'?Number(a.key)-Number(b.key):String(a.key).localeCompare(String(b.key)))}
function rankGroups(groups,measure,limit=16){const lowerIsBetter=!['lap_count','driver_count','top_speed','tyre_age'].includes(measure);return[...groups].sort((a,b)=>lowerIsBetter?a.value-b.value:b.value-a.value).slice(0,limit)}

function kpiVisual(data,widget){const value=metricValue(data,widget.measure),metric=METRICS[widget.measure];return`<div class="kpi-body"><span class="kpi-accent"></span><strong>${metricFormat(value,widget.measure)}</strong><p>${esc(metric?.description||'Calculated measure')}<br>${data.length.toLocaleString()} rows in current filter context</p></div>`}
function barVisual(data,widget){let groups=rankGroups(groupsFor(data,widget.dimension,widget.measure),widget.measure,14);if(!groups.length)return emptyVisual();const width=640,height=230,left=38,right=14,top=12,bottom=48,values=groups.map((group)=>group.value),min=Math.min(0,...values),max=Math.max(...values),range=max-min||1,band=(width-left-right)/groups.length,plotHeight=height-top-bottom;return`<svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(widget.title)} bar chart"><line class="chart-grid" x1="${left}" y1="${top}" x2="${left}" y2="${height-bottom}"/><line class="chart-grid" x1="${left}" y1="${height-bottom}" x2="${width-right}" y2="${height-bottom}"/>${groups.map((group,index)=>{const barHeight=Math.max(2,(group.value-min)/range*plotHeight),x=left+index*band+band*.13,y=height-bottom-barHeight,colour=group.colour||PALETTE[index%PALETTE.length],label=String(group.key).slice(0,9);return`<g class="chart-mark" data-group="${esc(group.key)}" data-dimension="${esc(widget.dimension)}"><title>${esc(group.key)} · ${esc(metricFormat(group.value,widget.measure))}</title><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(3,band*.74).toFixed(1)}" height="${barHeight.toFixed(1)}" rx="2" fill="${colour}"/><text class="chart-axis" x="${(x+band*.37).toFixed(1)}" y="${height-bottom+14}" text-anchor="middle" transform="rotate(-32 ${(x+band*.37).toFixed(1)} ${height-bottom+14})">${esc(label)}</text></g>`}).join('')}</svg>`}
function lineVisual(data,widget){const groups=groupsFor(data,widget.dimension||'lap',widget.measure).slice(-80);if(groups.length<2)return emptyVisual('Not enough points in this filter context.');const width=660,height=230,left=45,right=18,top=14,bottom=30,values=groups.map((group)=>group.value),min=Math.min(...values),max=Math.max(...values),pad=(max-min)*.08||1,yMin=min-pad,yMax=max+pad,x=(index)=>left+index/(groups.length-1)*(width-left-right),y=(value)=>top+(yMax-value)/(yMax-yMin)*(height-top-bottom),path=groups.map((group,index)=>`${index?'L':'M'}${x(index).toFixed(1)},${y(group.value).toFixed(1)}`).join(' ');return`<svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(widget.title)} line chart">${[0,.25,.5,.75,1].map((step)=>{const yy=top+step*(height-top-bottom),value=yMax-step*(yMax-yMin);return`<line class="chart-grid" x1="${left}" y1="${yy}" x2="${width-right}" y2="${yy}"/><text class="chart-axis" x="${left-6}" y="${yy+3}" text-anchor="end">${esc(metricFormat(value,widget.measure).replace(' km/h',''))}</text>`}).join('')}<path class="chart-line" d="${path}"/>${groups.map((group,index)=>`<circle class="chart-dot" data-group="${esc(group.key)}" data-dimension="${esc(widget.dimension||'lap')}" cx="${x(index).toFixed(1)}" cy="${y(group.value).toFixed(1)}" r="3"><title>${esc(group.key)} · ${esc(metricFormat(group.value,widget.measure))}</title></circle>`).join('')}<text class="chart-axis" x="${left}" y="${height-5}">${esc(groups[0].key)}</text><text class="chart-axis" x="${width-right}" y="${height-5}" text-anchor="end">${esc(groups.at(-1).key)}</text></svg>`}
function scatterVisual(data,widget){const groups=groupsFor(data,widget.dimension||'driver',widget.measure).map((group)=>({...group,y:metricValue(group.rows,widget.measure2||'top_speed')})).filter((group)=>group.y!==null);if(groups.length<2)return emptyVisual('Choose measures with enough paired values.');const width=660,height=230,left=50,right=20,top=15,bottom=35,xValues=groups.map((group)=>group.value),yValues=groups.map((group)=>group.y),xMin=Math.min(...xValues),xMax=Math.max(...xValues),yMin=Math.min(...yValues),yMax=Math.max(...yValues),sx=(value)=>left+(value-xMin)/(xMax-xMin||1)*(width-left-right),sy=(value)=>height-bottom-(value-yMin)/(yMax-yMin||1)*(height-top-bottom);return`<svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(widget.title)} scatter plot">${[0,.25,.5,.75,1].map((step)=>`<line class="chart-grid" x1="${left}" y1="${top+step*(height-top-bottom)}" x2="${width-right}" y2="${top+step*(height-top-bottom)}"/>`).join('')}${groups.map((group,index)=>`<circle class="chart-mark" data-group="${esc(group.key)}" data-dimension="${esc(widget.dimension||'driver')}" cx="${sx(group.value).toFixed(1)}" cy="${sy(group.y).toFixed(1)}" r="7" fill="${group.colour||PALETTE[index%PALETTE.length]}"><title>${esc(group.key)} · ${esc(metricFormat(group.value,widget.measure))} / ${esc(metricFormat(group.y,widget.measure2||'top_speed'))}</title></circle>`).join('')}<text class="chart-axis" x="${left}" y="${height-7}">${esc(METRICS[widget.measure]?.label)}</text><text class="chart-axis" x="${width-right}" y="${height-7}" text-anchor="end">${esc(METRICS[widget.measure2||'top_speed']?.label)}</text></svg>`}
function tableVisual(data,widget){const groups=rankGroups(groupsFor(data,widget.dimension||'driver',widget.measure),widget.measure,18);if(!groups.length)return emptyVisual();return`<table class="data-table"><thead><tr><th>${esc(DIMENSIONS[widget.dimension]?.label||'Group')}</th><th>${esc(METRICS[widget.measure]?.label||'Measure')}</th></tr></thead><tbody>${groups.map((group,index)=>`<tr data-group="${esc(group.key)}" data-dimension="${esc(widget.dimension)}"><td><span class="rank">${index+1}</span>${esc(group.key)}</td><td>${esc(metricFormat(group.value,widget.measure))}</td></tr>`).join('')}</tbody></table>`}
function emptyVisual(message='No data in this filter context.'){return`<div class="widget-empty">${esc(message)}</div>`}
function renderWidget(widget,data){let content;try{content=widget.type==='kpi'?kpiVisual(data,widget):widget.type==='bar'?barVisual(data,widget):widget.type==='line'?lineVisual(data,widget):widget.type==='scatter'?scatterVisual(data,widget):tableVisual(data,widget)}catch(error){content=emptyVisual('This visual could not be calculated.')}return`<article class="widget${widget.id===selectedWidgetId?' selected':''}" data-widget="${widget.id}" style="--span:${Math.max(3,Math.min(12,Number(widget.span)||6))};--height:${HEIGHTS[widget.height]||HEIGHTS.medium}px"><header class="widget-head" data-select-widget="${widget.id}"><div class="widget-title"><strong>${esc(widget.title)}</strong><small>${esc(METRICS[widget.measure]?.label||'Measure')}${widget.dimension?` by ${esc(DIMENSIONS[widget.dimension]?.label||widget.dimension)}`:''}</small></div><span class="widget-kind">${esc(VISUALS[widget.type]||widget.type)}</span></header><div class="widget-body">${content}</div></article>`}

function renderProjects(){const project=activeProject();qs('projectList').innerHTML=store.projects.map((item)=>`<button class="rail-item${item.id===project.id?' active':''}" data-project="${item.id}"><span>${esc(item.name)}</span><small>${item.pages.length}P</small></button>`).join('');qs('projectTitle').value=project.name;qs('breadcrumbProject').textContent=project.name}
function renderPages(){const page=activePage();qs('pageList').innerHTML=activeProject().pages.map((item,index)=>`<button class="rail-item${item.id===page?.id?' active':''}" data-page="${item.id}"><span>${esc(item.name)}</span><small>${String(index+1).padStart(2,'0')}</small></button>`).join('');qs('breadcrumbPage').textContent=page?.name||'No page';qs('pageTitle').textContent=page?.name||'No page'}
function renderTemplates(){qs('templateList').innerHTML=TEMPLATES.map((template)=>`<button class="template-button" data-template="${template.id}"><b>${template.icon}</b><span>${esc(template.name)}</span></button>`).join('')}
function renderFilters(){const project=activeProject(),filters=project.filters,drivers=[...new Set(rows.map((row)=>row.driver))].sort(),teams=[...new Set(rows.map((row)=>row.team))].sort(),compounds=[...new Set(rows.map((row)=>row.compound))].sort();qs('driverFilter').innerHTML=options(drivers,filters.driver,'All drivers');qs('teamFilter').innerHTML=options(teams,filters.team,'All teams');qs('compoundFilter').innerHTML=options(compounds,filters.compound,'All compounds');qs('lapMin').value=filters.lapMin??'';qs('lapMax').value=filters.lapMax??'';qs('representativeFilter').checked=filters.representative}
function renderCanvas(){const page=activePage(),data=filteredRows();if(!page){qs('reportCanvas').innerHTML='<div class="no-page"><div><strong>No report page</strong>Create a page from an analysis template.</div></div>';return}qs('reportCanvas').innerHTML=page.widgets.length?page.widgets.map((widget)=>renderWidget(widget,data)).join(''):`<div class="no-page"><div><strong>Blank canvas</strong>Add a visual or choose a field from the inspector.<br><button class="primary-button" data-empty-add>+ Add first visual</button></div></div>`;const analytics=sessionState?.analytics,session=sessionState?.session||{};qs('reportKicker').textContent=`${session.location||session.circuit_short_name||'Formula 1'} / ${session.session_name||'Session'}`;qs('coverage').innerHTML=`${data.length.toLocaleString()} filtered rows · ${(analytics?.summary?.representative_laps||0).toLocaleString()} representative laps<br>${(analytics?.drivers?.length||0)} drivers · session ${esc(activeProject().session)}`}
function visualOptions(items,current){return Object.entries(items).map(([value,item])=>`<option value="${value}"${value===current?' selected':''}>${esc(item.label||item)}</option>`).join('')}
function renderInspector(){const widget=selectedWidget();if(!widget){qs('visualInspector').innerHTML='<div class="empty-inspector">Select a visual to configure it.<br>Click any dataset field to add a new visual.</div>';return}qs('visualInspector').innerHTML=`<section class="inspector-section"><label class="inspector-label" for="visualTitle">Visual title</label><input class="inspector-field" id="visualTitle" value="${esc(widget.title)}"><span class="inspector-label">Visual type</span><div class="visual-picker">${Object.entries(VISUALS).map(([type,label])=>`<button class="${type===widget.type?'active':''}" data-visual-type="${type}" title="${label}">${label.slice(0,2).toUpperCase()}</button>`).join('')}</div></section><section class="inspector-section"><label class="inspector-label" for="visualDimension">Category / axis</label><select class="inspector-field" id="visualDimension"><option value="">No category</option>${visualOptions(DIMENSIONS,widget.dimension)}</select><label class="inspector-label" for="visualMeasure">Primary measure</label><select class="inspector-field" id="visualMeasure">${visualOptions(METRICS,widget.measure)}</select><label class="inspector-label" for="visualMeasure2">Secondary measure</label><select class="inspector-field" id="visualMeasure2"><option value="">None</option>${visualOptions(METRICS,widget.measure2)}</select></section><section class="inspector-section"><div class="inspector-row"><div><label class="inspector-label" for="visualWidth">Width</label><select class="inspector-field" id="visualWidth">${[3,4,6,8,9,12].map((span)=>`<option value="${span}"${Number(widget.span)===span?' selected':''}>${span}/12</option>`).join('')}</select></div><div><label class="inspector-label" for="visualHeight">Height</label><select class="inspector-field" id="visualHeight">${Object.keys(HEIGHTS).map((height)=>`<option value="${height}"${widget.height===height?' selected':''}>${height}</option>`).join('')}</select></div></div><div class="rail-actions"><button class="secondary-button" data-widget-action="left">Move left</button><button class="secondary-button" data-widget-action="right">Move right</button><button class="secondary-button" data-widget-action="duplicate">Duplicate</button><button class="secondary-button" data-widget-action="copy">Copy JSON</button></div></section><section class="inspector-section"><button class="danger-button" data-widget-action="delete">Delete visual</button></section>`}
function renderFields(query=''){const normalized=query.trim().toLowerCase(),entries=[...Object.entries(DIMENSIONS).map(([id,item])=>({id,label:item.label,kind:'dimension'})),...Object.entries(METRICS).map(([id,item])=>({id,label:item.label,kind:'measure'}))].filter((item)=>item.label.toLowerCase().includes(normalized));qs('fieldList').innerHTML=entries.map((item)=>`<button class="field-button" data-field="${item.id}" data-field-kind="${item.kind}"><span><i class="${item.kind}-dot"></i>${esc(item.label)}</span><small>${item.kind}</small></button>`).join('')||'<div class="empty-inspector">No matching fields.</div>'}
function renderAll(){renderProjects();renderPages();renderFilters();renderCanvas();renderInspector();renderFields(qs('fieldSearch').value);syncUrl()}

async function loadSession(sessionKey=activeProject().session){const sequence=++loadSequence,key=String(sessionKey||DEFAULT_SESSION).trim();if(!/^\d+$/.test(key)){toast('Enter a numeric OpenF1 session key.');return}activeProject().session=key;qs('sessionKey').value=key;qs('datasetStatus').textContent='Loading';qs('datasetMeta').innerHTML='Fetching lap, stint, speed, and weather data…';qs('saveState').className='save-state loading';qs('saveLabel').textContent='Loading data';try{const response=await fetch(`/api/pit-wall?v=5&pit_loss=22&session_key=${encodeURIComponent(key)}`),payload=await response.json();if(sequence!==loadSequence)return;if(!response.ok||!payload.state||!['live','session'].includes(payload.status))throw new Error(payload.message||'Session data is unavailable.');sessionState=payload.state;rows=buildRows(sessionState.analytics);const session=sessionState.session||{},meeting=sessionState.meeting||{};qs('datasetStatus').textContent=payload.status==='live'?'Live':'Ready';qs('datasetMeta').innerHTML=`<strong>${esc(meeting.meeting_name||session.location||'Formula 1')} · ${esc(session.session_name||'Session')}</strong>${rows.length.toLocaleString()} lap rows · ${(sessionState.analytics?.drivers?.length||0)} drivers`;renderAll();persist();toast(`${session.session_name||'Session'} loaded: ${rows.length.toLocaleString()} lap rows.`)}catch(error){if(sequence!==loadSequence)return;sessionState=null;rows=[];qs('datasetStatus').textContent='Error';qs('datasetMeta').textContent=error.message;renderAll();qs('saveState').className='save-state error';qs('saveLabel').textContent='Data unavailable';toast(error.message)}}
function setFilter(name,value){const filters=activeProject().filters;if(['lapMin','lapMax'].includes(name))filters[name]=value===''?null:Number(value);else if(name==='representative')filters[name]=Boolean(value);else filters[name]=value;renderFilters();renderCanvas();persist()}
function clearFilters(){activeProject().filters={driver:'ALL',team:'ALL',compound:'ALL',representative:true,lapMin:null,lapMax:null};renderFilters();renderCanvas();persist();toast('Report filters cleared.')}
function applyCrossFilter(dimension,value){if(dimension==='driver'||dimension==='team'||dimension==='compound'){activeProject().filters[dimension]=String(value);renderFilters();renderCanvas();persist();toast(`${DIMENSIONS[dimension].label} filter: ${value}`)}else if(dimension==='lap'){activeProject().filters.lapMin=Number(value);activeProject().filters.lapMax=Number(value);renderFilters();renderCanvas();persist();toast(`Cross-filtered to lap ${value}.`)}}
function addWidget(configuration={}){const page=activePage();if(!page)return;const widget={id:uid('visual'),type:configuration.type||'bar',title:configuration.title||'New analysis',dimension:configuration.dimension??'driver',measure:configuration.measure||'best_lap',measure2:configuration.measure2||'top_speed',span:configuration.span||6,height:configuration.height||'medium'};page.widgets.push(widget);selectedWidgetId=widget.id;renderCanvas();renderInspector();persist();qs('inspector').classList.add('open')}
function addPage(template){const project=activeProject(),page=pageFromTemplate(template);project.pages.push(page);project.activePageId=page.id;selectedWidgetId=null;renderAll();persist();toast(`${template.name} page added.`)}
function createProject(){const project=newProject(`Race Intelligence ${store.projects.length+1}`,activeProject()?.session||DEFAULT_SESSION);store.projects.push(project);store.activeProjectId=project.id;selectedWidgetId=null;renderAll();persist();loadSession(project.session);toast('New report project created.')}
function selectProject(id){if(!store.projects.some((project)=>project.id===id))return;store.activeProjectId=id;selectedWidgetId=null;qs('sessionKey').value=activeProject().session;renderAll();loadSession(activeProject().session)}
function updateWidget(change){const widget=selectedWidget();if(!widget)return;Object.assign(widget,change);renderCanvas();renderInspector();persist()}
function widgetAction(action){const page=activePage(),widget=selectedWidget(),index=page?.widgets.findIndex((item)=>item.id===widget?.id);if(!page||!widget||index<0)return;if(action==='delete'){page.widgets.splice(index,1);selectedWidgetId=null}else if(action==='duplicate'){const copy={...clone(widget),id:uid('visual'),title:`${widget.title} copy`};page.widgets.splice(index+1,0,copy);selectedWidgetId=copy.id}else if(action==='left'&&index>0){[page.widgets[index-1],page.widgets[index]]=[page.widgets[index],page.widgets[index-1]]}else if(action==='right'&&index<page.widgets.length-1){[page.widgets[index+1],page.widgets[index]]=[page.widgets[index],page.widgets[index+1]]}else if(action==='copy'){navigator.clipboard?.writeText(JSON.stringify(widget,null,2));toast('Visual definition copied.');return}renderCanvas();renderInspector();persist()}
function addFromField(id,kind){if(kind==='measure')addWidget({measure:id,title:METRICS[id].label,type:id==='lap_count'?'kpi':'bar'});else addWidget({dimension:id,title:`${DIMENSIONS[id].label} analysis`,measure:'median_pace',type:id==='lap'?'line':'bar'})}
function exportProject(){const project=activeProject(),slug=project.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'pit-wall-project';download(`${slug}.json`,JSON.stringify({product:'Pit Wall Studio',version:1,exportedAt:new Date().toISOString(),project},null,2),'application/json')}
function exportCsv(){const data=filteredRows(),columns=['driver','driverNumber','team','lap','lap_time','s1','s2','s3','compound','stint','tyre_age','i1','i2','trap','representative','pit_out','date'],cell=(value)=>`"${String(value??'').replace(/"/g,'""')}"`;download(`pit-wall-session-${activeProject().session}.csv`,[columns,...data.map((row)=>columns.map((column)=>row[column]))].map((line)=>line.map(cell).join(',')).join('\n'),'text/csv')}
function encodeReport(project){const json=JSON.stringify({name:project.name,session:project.session,activePageId:project.activePageId,pages:project.pages,filters:project.filters});return btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeReport(value){const normalized=value.replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(normalized))))}
async function shareView(){const url=new URL(location.href);url.searchParams.set('report',encodeReport(activeProject()));url.searchParams.delete('page');try{await navigator.clipboard.writeText(url.toString());toast('Shareable report link copied.')}catch(error){prompt('Copy this shareable report link:',url.toString())}}
function importReport(projectish){if(!projectish||!Array.isArray(projectish.pages))throw new Error('That file is not a Pit Wall Studio project.');const project={...newProject(),...projectish,id:uid('project'),name:`${projectish.name||'Imported report'} (imported)`,pages:projectish.pages.map((page)=>({...page,id:uid('page'),widgets:(page.widgets||[]).map((widget)=>({...widget,id:uid('visual')}))}))};project.activePageId=project.pages[0]?.id;store.projects.push(project);store.activeProjectId=project.id;selectedWidgetId=null;renderAll();persist();loadSession(project.session);toast('Project imported.')}
function importSharedReport(){const encoded=new URLSearchParams(location.search).get('report');if(!encoded)return false;try{const shared=decodeReport(encoded);importReport({...shared,name:`${shared.name||'Shared report'} (shared)`});const url=new URL(location.href);url.searchParams.delete('report');history.replaceState({},'',url);return true}catch(error){toast('The shared report link is invalid.');return false}}

qs('projectList').onclick=(event)=>{const button=event.target.closest('[data-project]');if(button)selectProject(button.dataset.project)};
qs('pageList').onclick=(event)=>{const button=event.target.closest('[data-page]');if(!button)return;activeProject().activePageId=button.dataset.page;selectedWidgetId=null;renderAll();persist()};
qs('templateList').onclick=(event)=>{const button=event.target.closest('[data-template]'),template=TEMPLATES.find((item)=>item.id===button?.dataset.template);if(template)addPage(template)};
qs('sessionForm').onsubmit=(event)=>{event.preventDefault();loadSession(qs('sessionKey').value)};
qs('newProject').onclick=createProject;qs('newBlankPage').onclick=()=>addPage(TEMPLATES.find((item)=>item.id==='blank'));qs('addVisual').onclick=()=>addWidget();
qs('projectTitle').onchange=(event)=>{activeProject().name=event.target.value.trim()||'Untitled report';renderProjects();renderPages();persist()};
qs('driverFilter').onchange=(event)=>setFilter('driver',event.target.value);qs('teamFilter').onchange=(event)=>setFilter('team',event.target.value);qs('compoundFilter').onchange=(event)=>setFilter('compound',event.target.value);qs('lapMin').onchange=(event)=>setFilter('lapMin',event.target.value);qs('lapMax').onchange=(event)=>setFilter('lapMax',event.target.value);qs('representativeFilter').onchange=(event)=>setFilter('representative',event.target.checked);qs('clearFilters').onclick=clearFilters;qs('undoFilter').onclick=clearFilters;
qs('reportCanvas').onclick=(event)=>{const empty=event.target.closest('[data-empty-add]');if(empty){addWidget();return}const group=event.target.closest('[data-group]');if(group){applyCrossFilter(group.dataset.dimension,group.dataset.group);return}const header=event.target.closest('[data-select-widget]'),article=event.target.closest('[data-widget]');if(header||article){selectedWidgetId=(header||article).dataset.selectWidget||article.dataset.widget;renderCanvas();renderInspector();qs('inspector').classList.add('open')}};
qs('visualInspector').onclick=(event)=>{const type=event.target.closest('[data-visual-type]'),action=event.target.closest('[data-widget-action]');if(type)updateWidget({type:type.dataset.visualType});if(action)widgetAction(action.dataset.widgetAction)};
qs('visualInspector').onchange=(event)=>{const map={visualTitle:'title',visualDimension:'dimension',visualMeasure:'measure',visualMeasure2:'measure2',visualWidth:'span',visualHeight:'height'},property=map[event.target.id];if(property)updateWidget({[property]:property==='span'?Number(event.target.value):event.target.value})};
qs('fieldSearch').oninput=(event)=>renderFields(event.target.value);qs('fieldList').onclick=(event)=>{const button=event.target.closest('[data-field]');if(button)addFromField(button.dataset.field,button.dataset.fieldKind)};
qs('exportProject').onclick=exportProject;qs('exportCsv').onclick=exportCsv;qs('printReport').onclick=()=>window.print();qs('shareView').onclick=shareView;qs('importProject').onclick=()=>qs('importFile').click();qs('importFile').onchange=async(event)=>{try{const parsed=JSON.parse(await event.target.files[0].text());importReport(parsed.project||parsed)}catch(error){toast(error.message||'Could not import that project.')}event.target.value=''};
qs('openInspector').onclick=()=>qs('inspector').classList.add('open');qs('closeInspector').onclick=()=>qs('inspector').classList.remove('open');qs('openRail').onclick=()=>qs('leftRail').classList.toggle('open');
window.addEventListener('keydown',(event)=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='s'){event.preventDefault();persist();toast('Project saved locally.')}if(event.key==='Escape'){qs('inspector').classList.remove('open');qs('leftRail').classList.remove('open')}});

function boot(){renderTemplates();renderFields();const imported=importSharedReport(),project=activeProject(),querySession=new URLSearchParams(location.search).get('session');if(querySession&&!imported)project.session=querySession;qs('sessionKey').value=project.session||DEFAULT_SESSION;renderAll();loadSession(project.session||DEFAULT_SESSION)}
boot();
</script>
</body>
</html>
