<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Personal ERP">
  <link rel="manifest" href="/os/site.webmanifest">
  <link rel="stylesheet" href="/os/styles.css">
  <title>Personal ERP</title>
</head>
<body>
  <header class="topbar">
    <div><span class="mark">Personal ERP</span><span id="week-chip" class="week-chip">Week —</span></div>
    <form action="/os/logout" method="post"><button class="text-button" type="submit">Sign out</button></form>
  </header>
  <main id="app" aria-live="polite">
    <section class="loading"><span></span><p>Loading</p></section>
  </main>
  <nav class="dock" aria-label="Sections">
    <button data-view="now" class="active"><span>Today</span></button>
    <button data-view="goals"><span>Goals</span></button>
    <button data-view="money"><span>Finances</span></button>
    <button data-view="close"><span>Close</span></button>
  </nav>
  <dialog id="dialog"><button class="dialog-x" id="dialog-close" aria-label="Close">×</button><div id="dialog-body"></div></dialog>
  <div id="toast" role="status"></div>
  <script src="/os/app.js" defer></script>
</body>
</html>
